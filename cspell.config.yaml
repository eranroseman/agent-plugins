# Read by tests/test-spelling.sh over the explicit lists tests/lib.sh derives
# (spec §8.1): the owned markdown outside docs/superpowers, plus the comments
# of the shell and YAML files. It also spells every checked JSON file whole.
# The scope is an argument at the call site, not an ignorePaths here.
version: "0.2"
# The prose was mixed (British spellings beside American ones in the same
# skills) and everything this repository embeds is American, so a decision:
# US English.
language: en-US
ignorePaths: []
# Proper nouns, domain terms and coinages the owned prose uses. Never a
# misspelling: a typo is fixed, not listed.
words:
  - actioned
  - Akhourii
  - archify
  - basenames
  - callees
  - Dependabot
  - diffable
  - Eran
  - eranroseman
  - frontmatter
  - glab
  - HITL
  - lname
  - mattpocock
  - nosuch
  - obra
  - pathspec
  - pathspecs
  - Pocock
  - pycache
  - pyyaml
  - relativization
  - relitigated
  - relpath
  - Roseman
  - scaffolder
  - sensemaking
  - SIGPIPE
  - softaworks
  - subshell
  - Udit
  - unlabel
  - unrouted
  - wayfinder
  - wayfinding
  - worktrees
# Shell and YAML files are read for their `#` comments only. The override
# globs resolve relative to this file, which is why it lives at the root.
patterns:
  - name: hash-comments
    pattern: "/(?<=^|\\s)#.*$/gm"
overrides:
  - filename:
      - "scripts/*"
      - "tests/*.sh"
      - "**/*.yml"
      - "**/*.yaml"
    languageId: shellscript
    includeRegExpList:
      - hash-comments

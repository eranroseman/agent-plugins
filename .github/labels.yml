---
# Label color scheme:
#   red  # ff0000 - HITL, definite: a human must act/decide
#   yellow  # ffdd00 - pending/undetermined: could resolve to either HITL or AFK
#   green  # 0e8a16 - AFK, definite: an agent can proceed autonomously
#   purple           - structural wayfinder labels (map, and task since its
#                      HITL/AFK answer arrives later via a paired triage label)
#   pastel           - type axis: what kind of issue this is, one of
#                      bug/enhancement/documentation/upstream-drift and
#                      mutually exclusive across them. Deliberately off the
#                      red/yellow/green family so it never dilutes that signal
#
# An issue carries one type and one state. They are separate axes because the
# type is known at filing and the state is not: upstream-watch.yml opens a drift
# report with `--label upstream-drift --label needs-triage`, because whether an
# agent can take the bump depends on reading the upstream diff, which nothing
# has done yet. A drift report is a type like any other; that the watch also
# queries its label to find the one issue it updates in place is an
# implementation detail, not a meaning.
#   gray  # cfd3d7 - wontfix, terminal, outside the signal entirely

# GitHub
- name: bug
  color: f2c9c8
  description: Something isn't working
- name: enhancement
  color: d3f5f6
  description: New feature or request
- name: documentation
  color: d6ecfc
  description: Improvements or additions to documentation
- name: upstream-drift
  color: fadec8
  description: Filed by the scheduled upstream watch when a declared pin falls behind

# Triage
- name: wontfix
  color: cfd3d7
  description: This will not be worked on
- name: needs-triage
  color: ffdd00
  description: Maintainer needs to evaluate
- name: needs-info
  color: ffdd00
  description: Waiting on reporter
- name: ready-for-agent
  color: 0e8a16
  description: Fully specified, ready for an AFK agent
- name: ready-for-human
  color: ff0000
  description: Requires human implementation

# Wayfinder
- name: wayfinder:map
  color: 8b2fae
  description: Wayfinder map issue
- name: wayfinder:research
  color: 0e8a16
  description: AFK research ticket
- name: wayfinder:grilling
  color: ff0000
  description: HITL decision ticket
- name: wayfinder:prototype
  color: ff0000
  description: HITL prototype ticket
- name: wayfinder:task
  color: cbaadf
  description: Task ticket
